version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
